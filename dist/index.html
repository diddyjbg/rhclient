<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Rhythmhel</title>
<style>html,body{height:100%;margin:0;background:#0c0d1f;color:#eff0ff;font:16px system-ui,sans-serif;display:grid;place-items:center;text-align:center;overflow:hidden}
#s{display:grid;place-items:center}#s>*{grid-area:1/1}
.g{width:min(60vmin,480px);height:min(60vmin,480px);border-radius:50%;background:radial-gradient(circle,#a8a8e855,#a8a8e800 65%);animation:in 1.4s ease-out both}
.r{width:min(40vmin,330px);height:min(40vmin,330px);border-radius:50%;border:3px dashed #a8a8e8aa;animation:in 1.2s .15s ease-out both,spin 6s linear infinite}
img{width:min(34vmin,280px);height:min(34vmin,280px);object-fit:contain;animation:in 1.1s cubic-bezier(.2,1.4,.4,1) both,beat .5s 1.1s ease-in-out infinite alternate}
@keyframes in{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}@keyframes beat{to{transform:scale(1.04)}}@keyframes spin{to{transform:rotate(360deg)}}
h1{font-weight:300;font-size:34px;margin:0 0 8px}p{color:#9b9fcf}button{margin-top:18px;padding:12px 28px;border:0;border-radius:8px;background:#a8a8e8;color:#0c0d26;font:700 16px system-ui;cursor:pointer}
#off{display:none}</style></head>
<body><div id="s"><div class="g"></div><div class="r"></div><img src="logo.png" alt="Rhythmhel"></div>
<div id="off"><h1>Can't reach Rhythmhel</h1><p>Check your internet connection, then try again.</p><button onclick="go()">Try again</button></div>
<script>
// start screen bundled with the app: the logo (like osu! on launch), then the game as soon as the server answers
const GAME='https://rhythmhel.app/play.html',t0=Date.now();
async function go(){document.getElementById('s').style.display='';document.getElementById('off').style.display='none';
  try{await fetch('https://rhythmhel.app/rhythmhel.png',{mode:'no-cors',cache:'no-store'});setTimeout(()=>location.replace(GAME),Math.max(0,900-(Date.now()-t0)))}
  catch{document.getElementById('s').style.display='none';document.getElementById('off').style.display='block'}}
go();
</script></body></html>
