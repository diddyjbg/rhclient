[package]
name = "rhythmhel"
version = "1.0.0"
description = "Rhythmhel for Windows"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Pipes"] }

# small, fast release build
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
